name: CI - Pruebas automáticas

# AUT-07 / AUT-08: se ejecuta en cada push y en cada pull request.
on:
  push:
  pull_request:

jobs:
  flutter:
    name: App Flutter (análisis + pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # sqflite_common_ffi necesita la librería nativa de SQLite.
      - name: Instalar SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Dependencias
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze --no-fatal-infos

      - name: Pruebas unitarias, de integración y persistencia
        run: flutter test --coverage --reporter expanded

      - name: Guardar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-flutter
          path: app/coverage/lcov.info
          if-no-files-found: ignore

  backend:
    name: API Node.js (pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Dependencias
        run: npm ci

      - name: Pruebas de la API
        run: npm test
